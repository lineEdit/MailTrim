name: Windows build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore MailTrim.sln --locked-mode
      - run: dotnet build MailTrim.sln -c Release --no-restore
      - run: dotnet run --project tests/MailTrim.Tests -c Release --no-build
      - name: WebView2 integration checks
        run: dotnet run --project tests/MailTrim.Smoke -c Release --no-build -- "${{ runner.temp }}/mailtrim-smoke"
      - run: ./scripts/Publish.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: MailTrim-win-x64
          path: |
            artifacts/*.zip
            artifacts/*.sha256
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: MailTrim-win-x64
          path: artifacts
      - name: Create draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" artifacts/*.zip artifacts/*.sha256 rules/default.json --draft --prerelease --title "MailTrim $RELEASE_TAG" --notes-file CHANGELOG.md
